<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0c"><link rel="manifest" href="manifest.webmanifest"><title>LUMEN — литературные миры</title>
<style>
:root{--bg:#090b0c;--panel:#101315;--line:#2b2c2a;--gold:#c9a878;--text:#e8dfd2;--muted:#999994}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#202321 0,#090b0c 60%);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh}button,input,textarea{font:inherit}button,a{cursor:pointer;color:inherit}a{text-decoration:none}.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:100vh;max-width:1600px;margin:auto}.sidebar{border-right:1px solid var(--line);padding:24px 13px;display:flex;flex-direction:column;gap:9px;background:#080a0bea}.brand{text-align:center;color:var(--gold);font-size:22px;letter-spacing:4px;margin:4px 0 25px}.nav{border:0;background:transparent;text-align:left;padding:13px;color:var(--muted);border-radius:8px;display:block}.nav.active,.nav:hover{background:#202120;color:var(--text)}.quote{margin-top:auto;color:#777970;font-style:italic;line-height:1.6;font-size:13px;padding:10px}main{padding:22px;min-width:0}.search{width:100%;max-width:650px;border:1px solid #383a37;background:#0b0d0e;border-radius:28px;padding:13px 18px;color:var(--text);outline:none;margin-bottom:20px}.hero{min-height:220px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(90deg,#080b0df0,#080b0d9c 48%,#080b0d25),url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=85') center/cover}.hero-copy{padding:30px;max-width:480px}.hero h1{font-weight:normal;font-size:34px;line-height:1.1;margin:0 0 12px}.hero p{color:#c5c0b6;line-height:1.5}.btn{border:1px solid #8b7455;background:transparent;border-radius:7px;padding:10px 15px;color:#ddc6a5;display:inline-block}.btn:hover{background:#3a3024}.head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 13px}.head h2{font-size:23px;font-weight:normal;margin:0}.muted{color:var(--muted);font-size:13px;line-height:1.5}.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.book{display:flex;gap:12px;padding:11px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(140deg,#151718,#0a0c0d);min-width:0;cursor:pointer}.book:hover,.person:hover{border-color:#8b7455}.cover{width:100px;min-width:100px;height:145px;display:grid;place-items:center;text-align:center;padding:8px;font-size:16px;line-height:1.25;color:#e6c99b;border:1px solid #5a4936;background:linear-gradient(150deg,#67462e,#171a1a 68%,#080909);box-shadow:inset 0 0 20px #0008}.witcher{background:linear-gradient(150deg,#778078,#202523 55%,#090b0c);color:#ddd}.bible{background:linear-gradient(150deg,#695337,#17120d 65%,#070707);color:#d4b779}.book-info{min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:center}.book-info strong{font-weight:normal;font-size:16px;line-height:1.3}.count{font-size:11px;color:#b7b1a7;margin-top:auto}.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.person{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0e1011;cursor:pointer}.portrait{height:230px;background:linear-gradient(0deg,#111 0%,transparent 55%),linear-gradient(120deg,#282724,#080909);background-position:center;background-size:cover;filter:grayscale(.25) saturate(.65) contrast(1.1)}.portrait.p1{background-image:linear-gradient(0deg,#111,transparent 55%),url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=85')}.portrait.p2{background-image:linear-gradient(0deg,#111,transparent 55%),url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=85')}.portrait.p3{background-image:linear-gradient(0deg,#111,transparent 55%),url('https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=600&q=85')}.person-info{padding:12px}.person-info strong{font-weight:normal;font-size:17px}.chatlayout{max-width:900px;margin:0 auto}.back{color:var(--gold);display:inline-block;margin:8px 0 20px}.bookdetail{display:flex;gap:24px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:25px}.bookdetail .cover{width:150px;height:220px;font-size:20px}.bookdetail h1{font-weight:normal;margin:5px 0 10px}.chatlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:15px}.chatpage{max-width:850px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 44px);min-height:600px}.chathead{padding:15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#101213}.avatar{width:44px;height:44px;border-radius:50%;background:#292825;color:var(--gold);display:grid;place-items:center}.chatbody{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}.profile{border-bottom:1px solid var(--line);padding-bottom:16px;color:#c5c0b8;line-height:1.55;font-size:14px}.bubble{max-width:82%;padding:12px 14px;border-radius:10px;background:#171a1c;color:#d7d3cc;line-height:1.6;font-size:15px;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#252626}.chatform{padding:12px;border-top:1px solid var(--line)}.sendrow{display:flex;gap:8px}.sendrow input{min-width:0;flex:1;background:#111415;border:1px solid #2a2d2d;border-radius:9px;padding:14px;color:var(--text)}.sendrow button{border:1px solid #554632;background:#29251e;border-radius:9px;padding:0 18px;color:var(--gold)}.empty{color:var(--muted);padding:20px 0}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(540px,100%);background:#111415;border:1px solid #514634;border-radius:13px;padding:24px}.dialog h2{font-weight:normal}.dialog input,.dialog textarea{width:100%;padding:12px;margin:7px 0 12px;background:#080a0b;border:1px solid #343635;border-radius:7px;color:var(--text)}.dialog textarea{min-height:90px}.right{display:flex;justify-content:flex-end;gap:8px}.filelabel{display:inline-block}.note{font-size:12px;color:#85857f;margin-top:12px;line-height:1.5}
@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:3;flex-direction:row;align-items:center;overflow:auto;padding:8px}.brand{font-size:15px;margin:0 10px}.nav{white-space:nowrap;padding:10px;font-size:12px}.quote{display:none}main{padding:14px}.books{grid-template-columns:1fr}.people,.chatlist{grid-template-columns:repeat(2,minmax(0,1fr))}.portrait{height:170px}.bookdetail{flex-direction:column}.chatpage{height:calc(100vh - 70px)}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">♧ LUMEN</div><a class="nav active" href="index.html">⌂ Главная</a><a class="nav" href="index.html#library">▤ Библиотека</a><a class="nav" href="index.html#popular">✧ Популярное</a><button class="nav" id="uploadNav">⇧ Загрузить книгу</button><a class="nav" href="index.html#history">◷ История чатов</a><div class="quote">«Книги — это двери, которые ведут нас в другие миры».</div></aside><main id="main"></main></div><input type="file" id="fileInput" accept=".txt,.md,.pdf,.epub" multiple hidden><div class="modal" id="modal"><div class="dialog"><h2>Создать персонажа</h2><form id="charForm"><label>Имя персонажа</label><input id="charName" required placeholder="Имя героя"><label>Книга</label><input id="charBook" placeholder="Название книги"><label>Характер и манера речи</label><textarea id="charDesc" placeholder="Как он думает и говорит?"></textarea><div class="right"><button type="button" class="btn" id="cancel">Отмена</button><button class="btn">Создать</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s),main=$('#main');
const defaults=[
{title:'Гарри Поттер и философский камень',author:'Джоан Роулинг',genre:'Фэнтези',cover:'Harry Potter ✦',cls:'',chars:[['Гарри Поттер','Главный герой','Смелый, прямой и упрямый. Не любит пустых слов и не сразу доверяет незнакомцам.','p1'],['Гермиона Грейнджер','Ученица Хогвартса','Умная, подготовленная и принципиальная. Говорит точно, особенно когда уверена в своей правоте.','p2'],['Северус Снейп','Профессор','Холодный, язвительный и наблюдательный. Не склонен объяснять свои мотивы.','p3']]},
{title:'Последнее желание',author:'Анджей Сапковский',genre:'Тёмное фэнтези',cover:'THE WITCHER',cls:'witcher',chars:[['Геральт','Ведьмак','Немногословный, прагматичный, с сухим юмором. Не спешит судить людей по словам.','p3'],['Йеннифэр','Чародейка','Властная, проницательная и гордая. Не терпит снисходительности.','p2'],['Лютик','Поэт и бард','Остроязычный, обаятельный и склонный превращать события в истории.','p1']]},
{title:'Библия',author:'Разные авторы',genre:'Религиозные тексты',cover:'БИБЛИЯ ✧',cls:'bible',chars:[['Моисей','Пророк и вождь','Серьёзный собеседник, говорящий о долге, вере и ответственности.','p3'],['Давид','Царь и псалмопевец','Поэтичный, страстный и склонный к размышлениям о милосердии и власти.','p1'],['Апостол Павел','Апостол','Убеждённый и последовательный, строит речь вокруг веры и нравственного выбора.','p2']]}];
let uploaded=JSON.parse(localStorage.getItem('lumen_uploads')||'[]'),custom=JSON.parse(localStorage.getItem('lumen_custom')||'[]'),history=JSON.parse(localStorage.getItem('lumen_history')||'{}');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function allBooks(){return [...defaults,...uploaded]}
function bookBy(title){return allBooks().find(b=>b.title===title)||defaults[0]}
function link(page,params={}){let u=new URL('index.html',location.href);u.searchParams.set('page',page);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return u.pathname+u.search}
function cover(b){return `<div class="cover ${b.cls||''}">${esc(b.cover||b.title)}</div>`}
function bookCard(b){return `<a class="book" href="${link('book',{book:b.title})}">${cover(b)}<div class="book-info"><strong>${esc(b.title)}</strong><span class="muted">${esc(b.author||'Загруженная книга')}<br>${esc(b.genre||'Личная библиотека')}</span><span class="count">◉ ${(b.chars||[]).length} персонажа</span></div></a>`}
function personCard(c,b){return `<a class="person" href="${link('chat',{book:b.title,character:c[0]})}"><div class="portrait ${c[3]||'p1'}"></div><div class="person-info"><strong>${esc(c[0])}</strong><div class="muted">${esc(c[1]||b.title)}</div></div></a>`}
function renderHome(){main.innerHTML=`<input class="search" id="search" placeholder="⌕ Поиск книг и персонажей…"><section class="hero"><div class="hero-copy"><p style="letter-spacing:3px;color:#c9a878;font-size:11px">ТВОЯ ЛИЧНАЯ БИБЛИОТЕКА</p><h1>Войди в мир<br>между строк</h1><p>Не просто читай истории.<br>Говори с теми, кто в них живёт.</p><a class="btn" href="#popular">Открыть библиотеку →</a></div></section><div class="head" id="popular"><h2>Популярное</h2><span class="muted">Выбери книгу, чтобы увидеть героев</span></div><section class="books">${defaults.map(bookCard).join('')}</section><div class="head" id="library"><h2>Твоя библиотека</h2><button class="btn" id="uploadBtn">＋ Загрузить книгу</button></div><section class="books">${uploaded.length?uploaded.map(bookCard).join(''):'<div class="empty">Пока нет загруженных книг. Поддерживаются EPUB, PDF, TXT и MD.</div>'}</section><div class="head"><h2>История чатов</h2></div><section class="books">${Object.keys(history).length?Object.keys(history).map(k=>{let [b,c]=k.split('::');return `<a class="book" href="${link('chat',{book:b,character:c})}"><div class="book-info"><strong>${esc(c)}</strong><span class="muted">${esc(b)}</span></div></a>`}).join(''):'<div class="empty">Твои диалоги появятся здесь после начала общения.</div>'}</section>`;$('#search').oninput=e=>{$$('.book').forEach(el=>el.style.display=el.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none')};$('#uploadBtn').onclick=upload}
function $$(s){return [...document.querySelectorAll(s)]}
function renderBook(title){let b=bookBy(title);let chars=[...(b.chars||[]),...custom.filter(c=>c.book===title).map(c=>[c.name,c.role,c.desc,c.img||'p1'])];main.innerHTML=`<a class="back" href="index.html">← Назад в библиотеку</a><section class="bookdetail">${cover(b)}<div><h1>${esc(b.title)}</h1><p class="muted">${esc(b.author||'Загруженная книга')} · ${esc(b.genre||'Личная библиотека')}</p><p class="muted">Литературный мир для диалогов с персонажами.</p><button class="btn" id="addChar">＋ Создать персонажа</button></div></section><div class="head"><h2>Персонажи (${chars.length})</h2></div><section class="people">${chars.map(c=>personCard(c,b)).join('')}<button class="person" id="addChar2" style="text-align:center;padding:30px;background:#0c0e0f;border:1px dashed #665a47">＋<br><br>Создать персонажа<br><span class="muted">Добавить героя по имени</span></button></section>`;$('#addChar').onclick=$('#addChar2').onclick=()=>openChar(b.title)}
function renderChat(title,name){let b=bookBy(title),c=[...(b.chars||[]),...custom.filter(x=>x.book===title).map(x=>[x.name,x.role,x.desc,x.img||'p1'])].find(x=>x[0]===name)||[name,'Персонаж', 'Рассказывай. Я слушаю.','p1'];let k=title+'::'+name;history[k]??=[];main.innerHTML=`<div class="chatpage"><a class="back" href="${link('book',{book:title})}">← Назад к книге</a><div class="chathead"><div class="avatar">✦</div><div><strong>${esc(name)}</strong><div class="muted">${esc(title)}</div></div></div><div class="chatbody" id="messages"><div class="profile">${esc(c[2]||'')}</div></div><form class="chatform" id="chatForm"><div class="sendrow"><input id="msg" placeholder="Написать сообщение…" autocomplete="off"><button>➤</button></div><div class="muted" style="margin-top:8px">Демо-режим: ответы пока шаблонные. Подключим ИИ на следующем этапе.</div></form></div>`;function bubble(m){let d=document.createElement('div');d.className='bubble'+(m.who==='user'?' user':'');d.textContent=m.text;$('#messages').append(d)}history[k].forEach(bubble);$('#chatForm').onsubmit=e=>{e.preventDefault();let text=$('#msg').value.trim();if(!text)return;let arr=history[k];arr.push({who:'user',text});bubble(arr[arr.length-1]);$('#msg').value='';let reply=/привет|здравствуй/i.test(text)?'Привет. Что привело тебя сюда?':'Я обдумаю твои слова. Расскажи подробнее, что ты имеешь в виду.';arr.push({who:'bot',text:reply});bubble(arr[arr.length-1]);localStorage.setItem('lumen_history',JSON.stringify(history));$('#messages').scrollTop=$('#messages').scrollHeight}}
function openChar(book){$('#modal').classList.add('open');$('#charBook').value=book}
function upload(){$('#fileInput').click()}$('#uploadNav').onclick=upload;$('#fileInput').onchange=async e=>{for(let f of e.target.files){let ext=f.name.split('.').pop().toLowerCase();let title=f.name.replace(/\.[^.]+$/,'');let item={title,author:'Загруженная книга',genre:'Личная библиотека',cover:'МОЯ КНИГА',cls:'',chars:[],fileName:f.name,size:f.size,format:ext};if(ext==='txt'||ext==='md'){try{item.text=(await f.text()).slice(0,500000);item.chars=[['Новый персонаж','Создан из загруженной книги','Профиль можно уточнить после анализа текста.','p1']]}catch(err){}}uploaded=uploaded.filter(x=>x.title!==title);uploaded.unshift(item)}localStorage.setItem('lumen_uploads',JSON.stringify(uploaded));alert('Файл добавлен в библиотеку. Для PDF/EPUB в этой версии сохраняется карточка файла; извлечение текста и анализ книги требуют следующего этапа разработки.');renderHome();e.target.value=''};
$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};$('#charForm').onsubmit=e=>{e.preventDefault();let c={name:$('#charName').value.trim(),book:$('#charBook').value.trim()||'Моя библиотека',desc:$('#charDesc').value.trim(),role:'Создан пользователем',img:'p1'};custom.push(c);localStorage.setItem('lumen_custom',JSON.stringify(custom));$('#modal').classList.remove('open');location.href=link('book',{book:c.book})};
let params=new URLSearchParams(location.search),page=params.get('page'),book=params.get('book')||defaults[0].title,character=params.get('character')||'Гарри Поттер';if(page==='book')renderBook(book);else if(page==='chat')renderChat(book,character);else renderHome();
</script><script>if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
